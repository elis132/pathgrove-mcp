name: Release
# Pushing a tag such as v0.1.0 builds, smoke-tests and publishes to PyPI.
# PyPI trusts this workflow through OIDC (trusted publishing); no token is stored.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv sync --frozen --extra dev
      - run: uv build
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: .venv/bin/python tests/live_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: pathgrove-packages
          path: dist/
  publish:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pathgrove-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pathgrove-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
