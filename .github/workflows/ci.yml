name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubicloud-standard-2, windows-latest, macos-latest, macos-15-intel]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev python tests/live_smoke.py
  lint:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check src tests scripts
      - run: uv run --frozen --extra dev ruff format --check src tests scripts
